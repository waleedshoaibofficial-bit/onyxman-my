name: "MS-193 · 24/7 Every-30-Minute Real-Time Uptime, <800ms TTFB, Deep 280-Page Audit & Auto-Heal"

on:
  schedule:
    # Runs autonomously every 30 minutes (48x/day, 24/7) to detect and auto-heal any issue in real time
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Health monitor execution mode (--live for production HTTP checks, --dry-run for local build audit)"
        required: false
        default: "--live"
        type: choice
        options:
          - "--live"
          - "--dry-run"

permissions:
  contents: read

concurrency:
  group: "onyxman-6h-uptime-order-monitor"
  cancel-in-progress: false

env:
  NODE_ENV: "production"
  SITE_DOMAIN: "https://www.onyxmen.my"
  TTFB_BUDGET_MS: "800"
  PRIMARY_ORDER_EMAIL: "waleedshoaibofficial@gmail.com"
  BRAND_SALES_EMAIL: "sales@onyxmen.my"
  BRAND_INFO_EMAIL: "info@onyxmen.my"
  EXPECTED_SINGLE_PRICE: "RM 159"
  EXPECTED_SCHEMA_PRICE: "159.00"

jobs:
  uptime-and-order-bridge-monitor:
    name: "Audit & Auto-Heal https://www.onyxmen.my (HTTP 200, <800ms TTFB, @graph JSON-LD, RM 159 & Order Drawer)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "01 · Checkout Onyxmen.my Repository"
        uses: actions/checkout@v4

      - name: "02 · Setup Node.js 20 LTS Runtime"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "03 · Build Local Static Artifacts & Verify Integrity (--dry-run)"
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "Building local static HTML artifacts and running 6-Gate + dry-run check..."
          node scripts/build-site.mjs
          node scripts/seo-auto-optimizer.mjs
          node scripts/fetch-gsc-telemetry.mjs
          node scripts/verify-gate.mjs --phase=ALL
          node scripts/cloud-health-monitor.mjs --dry-run

      - name: "04 · Execute Production Cloud Health & Order Bridge Monitor (With Instant Auto-Heal)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode || '--live' }}"
          echo "Executing Onyxmen.my Cloud Health & Order Bridge Monitor (${MODE})..."
          if ! node scripts/cloud-health-monitor.mjs "${MODE}"; then
            echo "[AUTO-HEAL TRIGGERED] Live drift or error detected — automatically redeploying clean verified 280-page build to Cloudflare Pages..."
            if [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
              npx --yes wrangler@latest pages deploy public --project-name="onyxman-my" --branch=main --commit-dirty=true
              sleep 5
              node scripts/cloud-health-monitor.mjs "${MODE}"
            else
              exit 1
            fi
          fi
