name: "MS-192 Â· 24/7 Daily IndexNow & Sitemap Autonomous Ping (09:00 MYT)"

on:
  schedule:
    # Runs daily at 01:00 UTC = 09:00 MYT (Malaysia Standard Time morning peak)
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode (--live for production HTTP pings, --dry-run for local verification)"
        required: false
        default: "--live"
        type: choice
        options:
          - "--live"
          - "--dry-run"

permissions:
  contents: read

concurrency:
  group: "onyxman-daily-indexnow-ping"
  cancel-in-progress: false

env:
  NODE_ENV: "production"
  SITE_DOMAIN: "https://www.onyxmen.my"
  INDEXNOW_KEY: "onyxman2026myindexnowkey8899aabb"
  INDEXNOW_KEY_LOCATION: "https://www.onyxmen.my/indexnow-key.txt"
  SITEMAP_URL: "https://www.onyxmen.my/sitemap.xml"
  LLMS_TXT_URL: "https://www.onyxmen.my/llms.txt"

jobs:
  daily-indexnow-seo-ping:
    name: "Submit Canonical Sitemap URLs to IndexNow & Verify Sitemap/LLMs Reachability"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "01 · Checkout Onyxmen.my Repository"
        uses: actions/checkout@v4

      - name: "02 · Setup Node.js 20 LTS Runtime"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "03 · Ensure Built Sitemap, Freshness Signals & Static Artifacts Are Up to Date"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Building public/ artifacts and running Autonomous SEO Freshness Optimizer..."
          node scripts/build-site.mjs
          node scripts/seo-auto-optimizer.mjs
          if [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            npx --yes wrangler@latest pages deploy public --project-name=onyxman-my --branch=main --commit-dirty=true
          fi

      - name: "04 · Pre-Flight Local Sitemap & IndexNow Key Verification (--dry-run)"
        run: |
          node scripts/ping-indexnow.mjs --dry-run

      - name: "05 · Execute Live IndexNow Multi-Engine Submission (api.indexnow.org, Bing, Yandex, Seznam, Naver)"
        run: |
          MODE="${{ github.event.inputs.mode || '--live' }}"
          echo "Executing IndexNow submission in mode: ${MODE}"
          node scripts/ping-indexnow.mjs "${MODE}"

      - name: "06 · Verify Live HTTP 200 Reachability for All 5 Sitemaps, llms.txt & indexnow-key.txt"
        if: ${{ (github.event.inputs.mode || '--live') == '--live' }}
        run: |
          echo "Checking HTTP 200 reachability for all 5 XML sitemaps, llms.txt, and indexnow-key.txt..."
          curl -fsSLI "https://www.onyxmen.my/sitemap.xml" > /dev/null
          curl -fsSLI "https://www.onyxmen.my/sitemap-index.xml" > /dev/null
          curl -fsSLI "https://www.onyxmen.my/sitemap-en.xml" > /dev/null
          curl -fsSLI "https://www.onyxmen.my/sitemap-ms.xml" > /dev/null
          curl -fsSLI "https://www.onyxmen.my/sitemap-images.xml" > /dev/null
          curl -fsSLI "https://www.onyxmen.my/llms.txt" > /dev/null
          curl -fsSLI "https://www.onyxmen.my/seo-health-status.json" > /dev/null
          KEY_BODY=$(curl -fsSL "https://www.onyxmen.my/indexnow-key.txt" | tr -d '\r\n ')
          if [ "$KEY_BODY" != "onyxman2026myindexnowkey8899aabb" ]; then
            echo "::error::IndexNow key mismatch at https://www.onyxmen.my/indexnow-key.txt: got '$KEY_BODY'"
            exit 1
          fi
          echo "Verified IndexNow key match ($KEY_BODY) and HTTP 200 across all 5 XML sitemaps!"

